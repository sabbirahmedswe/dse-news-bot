[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dse_news_bot"
version = "0.1.0"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pip-system-certs",
    "python-dotenv"
]
requires-python = ">=3.13"
description = "Get updated news on your screened stocks from DSE on Telegram."
authors = [
    { name = "Sabbir Ahmed" , email = "sahmed.swe@gmail.com" }
]
readme = "README.md"

[project.scripts]
dse-news-bot = "dse_news_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]